name: Sync Rules from Upstream

on:
  schedule:
    - cron: '0 2 * * 1,4'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download upstream rules
        run: |
          # ═══════════════════════════════
          # 共享规则 → rules/list/（Surge 格式）
          # ═══════════════════════════════
          UPSTREAM="YouTube YouTubeMusic Netflix Disney HBO TikTok Spotify Microsoft Telegram Twitter GitHub Lan"
          for r in $UPSTREAM; do
            curl -sL --connect-timeout 15 --max-time 60 \
              "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/${r}/${r}.list" \
              -o "rules/list/${r}.list"
          done

          # ═══════════════════════════════
          # Rabbit-Spec China → source/China.txt + 规则生成
          # ═══════════════════════════════
          curl -sL --connect-timeout 15 --max-time 60 \
            "https://raw.githubusercontent.com/Rabbit-Spec/Surge/refs/heads/Master/Rules/China.list" \
            -o /tmp/China_download.list

          python3 -c "
          import re
          lines = open('/tmp/China_download.list').readlines()
          out = []
          for line in lines:
              line = line.rstrip('\n\r')
              if line.startswith('#') or not line.strip():
                  out.append(line); continue
              m = re.match(r'^(DOMAIN-SUFFIX|DOMAIN|DOMAIN-KEYWORD|IP-CIDR|IP-CIDR6|USER-AGENT),(.+)', line)
              if not m: continue
              rtype, val = m.group(1), m.group(2)
              if rtype == 'DOMAIN-SUFFIX':   out.append(val)
              elif rtype == 'DOMAIN':        out.append(f'={val}')
              elif rtype == 'DOMAIN-KEYWORD': out.append(f'~{val}')
              elif rtype == 'IP-CIDR':       out.append(f'ip:{val}')
              elif rtype == 'IP-CIDR6':      out.append(f'ip6:{val}')
              elif rtype == 'USER-AGENT':    out.append(f'ua:{val}')
          with open('rules/source/China.txt', 'w') as f:
              f.write('\n'.join(out) + '\n')
          "

          # ═══════════════════════════════
          # Shadowrocket 特有 → sr-rules/rule/
          # ═══════════════════════════════
          SR="GitLab Atlassian China Global"
          for r in $SR; do
            curl -sL --connect-timeout 15 --max-time 60 \
              "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/${r}/${r}.list" \
              -o "sr-rules/rule/${r}.list"
          done

      - name: Generate rules from source
        run: |
          python3 scripts/generate.py

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync rules from upstream [auto]"
          git push
