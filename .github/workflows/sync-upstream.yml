name: Sync Rules from Upstream

on:
  schedule:
    - cron: '0 2 * * 1,4'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download upstream rules
        run: |
          # ═══════════════════════════════
          # 共享规则 → rules/list/（Surge 格式）
          # ═══════════════════════════════
          UPSTREAM="YouTube YouTubeMusic Netflix Disney HBO TikTok Spotify Microsoft Telegram Twitter GitHub Lan"
          for r in $UPSTREAM; do
            curl -sL --connect-timeout 15 --max-time 60 \
              "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/${r}/${r}.list" \
              -o "rules/list/${r}.list"
          done

          # ═══════════════════════════════
          # Rabbit-Spec China 系列 → source/*.txt
          # ═══════════════════════════════
          CN_RULES="China ChinaMedia ChinaASN ChinaCIDR"
          for r in $CN_RULES; do
            curl -sL --connect-timeout 15 --max-time 60 \
              "https://raw.githubusercontent.com/Rabbit-Spec/Surge/refs/heads/Master/Rules/${r}.list" \
              -o "/tmp/${r}_download.list"
          done

          python3 -c "
          import re
          TYPE_MAP = {
              'DOMAIN-SUFFIX': '', 'DOMAIN': '=',
              'DOMAIN-KEYWORD': '~', 'IP-CIDR': 'ip:',
              'IP-CIDR6': 'ip6:', 'USER-AGENT': 'ua:',
              'IP-ASN': 'asn:', 'PROCESS-NAME': 'proc:',
          }
          for name in ['China', 'ChinaMedia', 'ChinaASN', 'ChinaCIDR']:
              lines = open(f'/tmp/{name}_download.list').readlines()
              out = []
              for line in lines:
                  line = line.rstrip('\n\r')
                  if line.startswith('#') or not line.strip():
                      out.append(line); continue
                  m = re.match(r'^([A-Z-]+),(.+)', line)
                  if not m: continue
                  rtype, val = m.group(1), m.group(2)
                  prefix = TYPE_MAP.get(rtype, '')
                  if rtype and prefix != '':
                      out.append(f'{prefix}{val}')
                  elif rtype:
                      out.append(f'{prefix}{val}')
                  continue
              with open(f'rules/source/{name}.txt', 'w') as f:
                  f.write('\n'.join(out) + '\n')
          "

          # ═══════════════════════════════
          # Shadowrocket 特有 → sr-rules/rule/
          # ═══════════════════════════════
          SR="GitLab Atlassian China Global"
          for r in $SR; do
            curl -sL --connect-timeout 15 --max-time 60 \
              "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/${r}/${r}.list" \
              -o "sr-rules/rule/${r}.list"
          done

          # ═══════════════════════════════
          # 小组件 → widget/（自动同步）
          # ═══════════════════════════════
          curl -sL --connect-timeout 15 --max-time 30 \
            "https://raw.githubusercontent.com/IBL3ND/module/refs/heads/main/Weather_Widget.JS" \
            -o "widget/Weather_Widget.js"
          curl -sL --connect-timeout 15 --max-time 30 \
            "https://raw.githubusercontent.com/IBL3ND/module/refs/heads/main/Sub_Widget.JS" \
            -o "widget/Sub_Widget.js"
          curl -sL --connect-timeout 15 --max-time 30 \
            "https://raw.githubusercontent.com/IBL3ND/module/refs/heads/main/CN_Cal.JS" \
            -o "widget/CN_Cal.js"

      - name: Generate rules from source
        run: |
          python3 scripts/generate.py

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync rules from upstream [auto]"
          git push
